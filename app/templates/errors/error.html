<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Error {{ code }} - Hospital IT Helpdesk</title>
    <style>
        body{font-family:'Segoe UI',sans-serif;background:#f4f6f9;display:flex;
             align-items:center;justify-content:center;height:100vh;margin:0;}
        .box{background:#fff;padding:40px;border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,.08);
             text-align:center;max-width:480px;}
        h1{font-size:3rem;margin:0;color:#0ea5e9;}
        p{color:#334155;}
        a{display:inline-block;margin-top:20px;padding:10px 18px;background:#0ea5e9;
          color:#fff;border-radius:5px;text-decoration:none;}
    </style>
</head>
<body>
    <div class="box">
        <h1>{{ code }}</h1>
        <p>{{ message }}</p>
        <a href="/">Return to Dashboard</a>
    </div>
</body>
</html>
