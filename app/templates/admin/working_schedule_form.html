{% extends "base.html" %}
{% block title %}Edit Working Schedule{% endblock %}
{% block page_title %}Edit Working Schedule{% endblock %}

{% block content %}
<div class="card">
    <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
        
        {% set day_names = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday'] %}
        <div class="form-group">
            <label>Day</label>
            <input type="text" class="form-control" value="{{ day_names[schedule.day_of_week] }}" readonly style="background: #f1f5f9;">
        </div>
        
        <div class="form-group">
            <label style="display: flex; align-items: center; gap: 8px;">
                <input type="checkbox" name="is_working_day" id="is-working-day" {% if schedule.is_working_day %}checked{% endif %}>
                Working Day
            </label>
        </div>
        
        <div id="time-fields" style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
            <div class="form-group">
                <label>Start Time</label>
                <input type="time" name="start_time" class="form-control" value="{{ schedule.start_time.strftime('%H:%M') if schedule.start_time else '08:00' }}">
            </div>
            <div class="form-group">
                <label>End Time</label>
                <input type="time" name="end_time" class="form-control" value="{{ schedule.end_time.strftime('%H:%M') if schedule.end_time else '17:00' }}">
            </div>
        </div>
        
        <div style="display: flex; gap: 10px;">
            <button type="submit" class="btn btn-primary">Update Schedule</button>
            <a href="{{ url_for('admin.working_schedule') }}" class="btn" style="background: #e2e8f0; color: #334155;">Cancel</a>
        </div>
    </form>
</div>

<script>
    document.getElementById('is-working-day').addEventListener('change', function() {
        document.getElementById('time-fields').style.display = this.checked ? 'grid' : 'none';
    });
    document.getElementById('is-working-day').dispatchEvent(new Event('change'));
</script>
{% endblock %}
